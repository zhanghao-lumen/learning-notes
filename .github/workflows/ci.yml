name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 语法检查
        run: python -m compileall -q python

      - name: 运行 Python 示例
        run: make py

      - name: 编译并运行 C 示例
        run: make c
